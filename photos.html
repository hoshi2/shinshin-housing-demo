<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>写真候補｜新進ハウジング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<style>
body{margin:0;background:#fbfaf6;color:#242d27;font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;font-size:14px;line-height:1.9;letter-spacing:.04em}
.wrap{max-width:1160px;margin:0 auto;padding:40px 24px 120px}
h1{font-family:"Shippori Mincho",serif;font-weight:500;font-size:22px;letter-spacing:.14em;margin:0 0 4px}
h2{font-family:"Shippori Mincho",serif;font-weight:500;font-size:17px;letter-spacing:.12em;margin:56px 0 14px;padding-top:24px;border-top:1px solid rgba(36,45,39,.13)}
h2 span{font-family:"Cormorant Garamond",serif;font-style:italic;color:#8aa391;margin-right:10px}
p.note{color:#6d776f;margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:18px}
.hero{grid-template-columns:repeat(5,1fr)}
.svc{grid-template-columns:repeat(3,1fr);max-width:900px}
figure{margin:0}
figure img{display:block;width:100%;object-fit:cover;background:#eee}
.hero img{aspect-ratio:9/16}
.svc img{aspect-ratio:3/2}
figcaption{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:#2e5a44;margin-top:6px;letter-spacing:.1em}
figcaption small{font-family:"Zen Kaku Gothic New",sans-serif;font-style:normal;font-size:12px;color:#6d776f;margin-left:8px;letter-spacing:.04em}
@media(max-width:700px){.hero{grid-template-columns:repeat(2,1fr)}.svc{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<h1>写真候補</h1>
<p class="note">実際のページと同じ切り抜きで表示しています。番号で教えてください。無料素材（Pexels）で、商用利用可・クレジット表記不要です。</p>

<figure><img src="img/candidates/hero-327483.jpg" alt=""><figcaption>G<small>日本家屋と庭</small></figcaption></figure>
<figure><img src="img/candidates/hero-6226120.jpg" alt=""><figcaption>H<small>木の日本家屋</small></figcaption></figure>
<figure><img src="img/candidates/hero-2187965.jpg" alt=""><figcaption>I<small>古民家に差す光</small></figcaption></figure>
<figure><img src="img/candidates/hero-19701869.jpg" alt=""><figcaption>J<small>木の店構え</small></figcaption></figure>
</div>

<figure><img src="img/candidates/svc-30987884.jpg" alt=""><figcaption>2<small>畳の部屋</small></figcaption></figure>

</div></body></html>
